[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataconv"
version = "0.1.0"
description = "Chunked, spillable data transformation execution system"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
dataconv = "dataconv.cli:main"
